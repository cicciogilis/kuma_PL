workflows:
  kuma-build:
    name: Kuma Powerlifting - Android + iOS
    max_build_duration: 120
    environment:
      groups:
        - android
        - ios
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Node dependencies
        script: |
          npm ci
      - name: Build web app (Vite)
        script: |
          npm run build
      - name: Initialize Capacitor
        script: |
          npx cap init kuma_PL com.cicciogilis.kuma --web-dir dist
      - name: Add platforms
        script: |
          npx cap add android
          npx cap add ios
      - name: Sync Capacitor
        script: |
          npx cap sync
      - name: Copy app icons
        script: |
          cp public/logo512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp public/logo512.png ios/App/App/Assets.xcassets/AppIcon.appiconset/Icon-1024.png 2>/dev/null || true
      - name: Build Android release APK
        script: |
          cd android
          ./gradlew assembleRelease
      - name: Build iOS release IPA
        script: |
          cd ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/Kuma.xcarchive archive
          xcodebuild -exportArchive -archivePath build/Kuma.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/ipa
    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
      - ios/build/ipa/*.ipa
    publishing:
      email:
        recipients:
          - cicciogilis@users.noreply.github.com
