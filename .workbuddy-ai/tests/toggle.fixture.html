<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture – toggle leaderboard settings</title>
<link rel="stylesheet" href="../../src/App.css">
</head>
<body>
<div class="app">
  <div class="profile-page">
    <h2>Settings</h2>

    <div class="profile-section" id="sec-toggle">
      <h3>Visualizzazione Leader Board</h3>
      <div class="toggle-row leaderboard-toggle-row" id="toggle-row">
        <label class="toggle-switch inline-toggle" id="toggle-switch">
          <input type="checkbox" checked>
          <span class="toggle-slider"></span>
        </label>
        <div class="toggle-text leaderboard-toggle-text" id="toggle-text">
          <span class="leaderboard-toggle-title">Mostra username sulla Leader Board</span>
          <p class="leaderboard-toggle-hint">Se disattivato, verranno mostrati Nome e Cognome</p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
